<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse TEMACO project photography and learn about our completed landscape and construction work.">
  <title>TEMACO Project</title>
  <link rel="icon" href="img/logoo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #f56421;
      --ink: #17202a;
      --muted: #69717a;
      --line: #dedede;
      --paper: #f4f3f1;
      --white: #fff;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }
    button, a { font: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid #1559c5; outline-offset: 3px; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      min-height: 80px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 5vw;
      border-bottom: 1px solid rgba(255,255,255,.28);
      background: #f56421;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .brand img { display: block; max-width: 140px; height: auto; }
    .site-nav { display: flex; align-items: center; gap: 25px; }
    .site-nav a {
      color: var(--white);
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .site-nav a:hover,
    .site-nav a:focus-visible,
    .site-nav a[aria-current="page"] { color: var(--white); border-bottom: 3px solid var(--white); }
    .nav-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.7);
      background: transparent;
      color: var(--white);
      font-size: 1.35rem;
      cursor: pointer;
    }

    main { width: min(1400px, 100%); margin: 0 auto; padding: 36px 5vw 70px; }
    .breadcrumb { margin-bottom: 36px; font-size: .78rem; color: var(--muted); }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--orange); }

    .project-intro {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, .5fr);
      gap: clamp(34px, 7vw, 100px);
      align-items: end;
      margin-bottom: 42px;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--orange);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 15px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 8vw, 7.8rem);
      font-weight: 400;
      letter-spacing: .01em;
      line-height: .88;
    }
    .project-description { max-width: 790px; margin: 0; color: var(--muted); font-size: 1.04rem; line-height: 1.75; }
    .project-facts { margin: 0; border-top: 1px solid var(--line); }
    .project-facts div { display: grid; grid-template-columns: 95px 1fr; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .project-facts dt { color: var(--muted); font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; }
    .project-facts dd { margin: 0; font-size: .88rem; font-weight: 700; }

    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px;
      gap: 12px;
      min-height: 620px;
    }
    .stage {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #ddd;
    }
    .stage-open {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .stage img { display: block; width: 100%; height: 100%; min-height: 620px; object-fit: cover; }
    .gallery-controls { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 8px; }
    .gallery-controls button {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border: 0;
      background: var(--white);
      color: var(--ink);
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.14);
    }
    .image-counter {
      position: absolute;
      left: 18px;
      bottom: 18px;
      padding: 9px 12px;
      background: rgba(20,25,30,.78);
      color: #fff;
      font-size: .75rem;
      letter-spacing: .12em;
    }
    .thumbnails { display: flex; flex-direction: column; gap: 10px; max-height: 620px; overflow-y: auto; padding: 2px; }
    .thumbnail {
      flex: 0 0 92px;
      padding: 0;
      overflow: hidden;
      border: 3px solid transparent;
      background: #ddd;
      cursor: pointer;
    }
    .thumbnail[aria-current="true"] { border-color: var(--orange); }
    .thumbnail img { display: block; width: 100%; height: 88px; object-fit: cover; }

    .project-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 34px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .project-switcher { display: flex; gap: 12px; }
    .project-switcher a, .quote-link {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 11px 19px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .quote-link { border-color: var(--orange); background: var(--orange); color: #fff; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(0,0,0,.92);
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 94vw; max-height: 90vh; object-fit: contain; }
    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      background: rgba(0,0,0,.25);
      color: #fff;
      font-size: 1.55rem;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      .nav-toggle { display: block; }
      .site-nav {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        display: none;
        align-items: stretch;
        flex-direction: column;
        gap: 0;
        padding: 12px 5vw 20px;
        border-bottom: 1px solid var(--line);
        background: var(--orange);
        box-shadow: 0 14px 30px rgba(0,0,0,.1);
      }
      .site-nav.open { display: flex; }
      .site-nav a { padding: 13px 0; border-bottom: 1px solid var(--paper); }
      main { padding-top: 25px; }
      .breadcrumb { margin-bottom: 25px; }
      .project-intro { grid-template-columns: 1fr; gap: 25px; }
      .gallery { grid-template-columns: 1fr; min-height: 0; }
      .stage img { min-height: 0; height: clamp(340px, 80vw, 560px); }
      .thumbnails { flex-direction: row; max-height: none; overflow-x: auto; overflow-y: hidden; }
      .thumbnail { flex-basis: 105px; }
      .project-footer { align-items: stretch; flex-direction: column; }
      .project-switcher { display: grid; grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TEMACO home"><img src="img/Logo.jpg" alt="TEMACO logo"></a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation">☰</button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="Catalogue1.html">Products</a>
      <a href="index.html#projects" aria-current="page">Projects</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a> &nbsp;/&nbsp; <a href="index.html#projects">Projects</a> &nbsp;/&nbsp; <span id="breadcrumb-name">Project</span>
    </nav>

    <section class="project-intro" aria-labelledby="project-title">
      <div>
        <p class="eyebrow" id="project-category">TEMACO Project</p>
        <h1 id="project-title">Project</h1>
        <p class="project-description" id="project-description"></p>
      </div>
      <dl class="project-facts">
        <div><dt>Scope</dt><dd id="project-scope"></dd></div>
        <div><dt>Location</dt><dd id="project-location"></dd></div>
        <div><dt>Delivery</dt><dd id="project-delivery"></dd></div>
      </dl>
    </section>

    <section class="gallery" aria-label="Project image gallery">
      <div class="stage">
        <button class="stage-open" id="stage-open" type="button" aria-label="Open current image fullscreen">
          <img id="main-image" alt="" decoding="async" fetchpriority="high">
        </button>
        <span class="image-counter" id="image-counter" aria-live="polite">1 / 1</span>
        <div class="gallery-controls">
          <button id="previous-image" type="button" aria-label="Previous image">←</button>
          <button id="next-image" type="button" aria-label="Next image">→</button>
        </div>
      </div>
      <div class="thumbnails" id="thumbnails" aria-label="Choose an image"></div>
    </section>

    <div class="project-footer">
      <div class="project-switcher">
        <a id="previous-project" href="#">← Previous project</a>
        <a id="next-project" href="#">Next project →</a>
      </div>
      <a class="quote-link" id="quote-link" href="index.html#contact">Discuss a Similar Project</a>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen project image" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close fullscreen image">×</button>
    <img id="lightbox-image" alt="">
  </div>

  <script>
    const builtInProjects = {
      nyandungu: {
        name: 'Nyandungu Eco-Park',
        category: 'Infrastructure & Sustainability',
        description: "Comprehensive road kerb supply and installation for Kigali's premier eco-tourism destination, supporting sustainable urban development while preserving environmental integrity.",
        scope: 'Kerbs, walkways and external works',
        location: 'Kigali, Rwanda',
        delivery: '20 km kerbs · 200+ workers',
        images: [
          'img/nyandungu/Nyandungu.jpg', 'img/nyandungu/Nyandungu-11.jpg',
          'img/nyandungu/nya.jpg', 'img/nyandungu/nyaa.jpg', 'img/nyandungu/nnya.jpg',
          'img/nyandungu/caption.jpg', 'img/nyandungu/caption%20(1).jpg', 'img/nyandungu/OIP.webp'
        ]
      },
      alu: {
        name: 'African Leadership University',
        category: 'Education',
        description: 'Supply and installation of concrete paving slabs and landscaping for the African Leadership University campus, creating a modern, accessible and inspiring environment for students and staff.',
        scope: 'Campus paving and landscaping',
        location: 'Kigali, Rwanda',
        delivery: 'Completed 2021',
        images: [
          'img/ALU/alu_ext_7_7375.jpg', 'img/ALU/alu_ext_1_95637.jpg',
          'img/ALU/alu_ext_3_96313.jpg', 'img/ALU/alu_ext_5_87713.jpg',
          'img/ALU/alu_ext_6_19704.jpg', 'img/ALU/alu_ext_4_32959.jpg',
          'img/ALU/alu_ext_2_6739.jpg', 'img/ALU/alu_ext_8_6338.jpg'
        ]
      },
      amahoro: {
        name: 'Amahoro Stadium',
        category: 'Major Infrastructure',
        description: "Supply and installation of concrete slabs and road kerbs for Rwanda's premier sports facility, delivered through extensive coordination, precision and on-site craftsmanship.",
        scope: 'Concrete slabs, paving and road kerbs',
        location: 'Kigali, Rwanda',
        delivery: '54,000 m² slabs · 4.6 km kerbs',
        images: [
          'img/amahoro.jpg', 'img/Amahoro/1.jpg', 'img/Amahoro/2.jpg', 'img/Amahoro/3.jpg',
          'img/Amahoro/4.jpg', 'img/Amahoro/5.jpg', 'img/Amahoro/6.jpg', 'img/Amahoro/7.jpg', 'img/Amahoro/8.jpg'
        ]
      },
      hoima: {
        name: 'Hoima Stadium',
        category: 'Regional Stadium',
        description: 'Major stadium works in Uganda featuring extensive paving, kerbs, walkways and external landscape construction for a modern community and national sports facility.',
        scope: 'Paving, kerbs and external works',
        location: 'Hoima, Uganda',
        delivery: 'Large multidisciplinary workforce',
        images: [
          'img/hoima/1.jpg', 'img/hoima/2.jpg', 'img/hoima/3.jpg',
          'img/hoima/5.jpg', 'img/hoima/8.jpg', 'img/hoima/9.jpg'
        ]
      }
    };

    let projects = { ...builtInProjects };
    let projectKeys = Object.keys(projects);
    const requestedProject = new URLSearchParams(window.location.search).get('project');
    let projectKey = Object.prototype.hasOwnProperty.call(projects, requestedProject) ? requestedProject : projectKeys[0];
    let project = projects[projectKey];
    let currentImage = 0;
    let lastFocusedElement = null;

    const mainImage = document.getElementById('main-image');
    const counter = document.getElementById('image-counter');
    const thumbnails = document.getElementById('thumbnails');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxClose = document.getElementById('lightbox-close');

    function showImage(index) {
      currentImage = (index + project.images.length) % project.images.length;
      const imageNumber = currentImage + 1;
      mainImage.src = project.images[currentImage];
      mainImage.alt = `${project.name} project view ${imageNumber}`;
      if (lightbox.classList.contains('open')) {
        lightboxImage.src = project.images[currentImage];
        lightboxImage.alt = mainImage.alt;
      }
      counter.textContent = `${imageNumber} / ${project.images.length}`;
      document.querySelectorAll('.thumbnail').forEach((button, buttonIndex) => {
        button.setAttribute('aria-current', String(buttonIndex === currentImage));
      });
    }

    function openLightbox() {
      lastFocusedElement = document.activeElement;
      lightboxImage.src = project.images[currentImage];
      lightboxImage.alt = mainImage.alt;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    function initializePage() {
      document.title = `${project.name} | TEMACO Projects`;
      document.getElementById('breadcrumb-name').textContent = project.name;
      document.getElementById('project-category').textContent = project.category;
      document.getElementById('project-title').textContent = project.name;
      document.getElementById('project-description').textContent = project.description;
      document.getElementById('project-scope').textContent = project.scope;
      document.getElementById('project-location').textContent = project.location;
      document.getElementById('project-delivery').textContent = project.delivery;
      document.getElementById('quote-link').href = `index.html?project=${encodeURIComponent(project.name)}#contact`;

      thumbnails.innerHTML = project.images.map((src, index) => `
        <button class="thumbnail" type="button" aria-label="Show project image ${index + 1}" aria-current="${index === 0}">
          <img src="${src}" alt="" loading="lazy" decoding="async">
        </button>
      `).join('');
      thumbnails.querySelectorAll('.thumbnail').forEach((button, index) => {
        button.addEventListener('click', () => showImage(index));
      });

      const projectIndex = projectKeys.indexOf(projectKey);
      const previousKey = projectKeys[(projectIndex - 1 + projectKeys.length) % projectKeys.length];
      const nextKey = projectKeys[(projectIndex + 1) % projectKeys.length];
      document.getElementById('previous-project').href = `project-details.html?project=${previousKey}`;
      document.getElementById('previous-project').setAttribute('aria-label', `Previous project: ${projects[previousKey].name}`);
      document.getElementById('next-project').href = `project-details.html?project=${nextKey}`;
      document.getElementById('next-project').setAttribute('aria-label', `Next project: ${projects[nextKey].name}`);
      showImage(0);
    }

    function mergeManagedProjects(records) {
      const managedProjects = {};
      if (Array.isArray(records)) {
        records.forEach(item => {
          const images = Array.isArray(item.gallery)
            ? item.gallery.map(image => typeof image === 'string' ? image : image && image.url).filter(Boolean)
            : [];
          if (!item.slug || !images.length) return;
          managedProjects[item.slug] = {
            name: item.name || 'TEMACO Project',
            category: item.category || 'TEMACO Project',
            description: item.description || '',
            scope: item.scope || 'Project delivery',
            location: item.location || 'Rwanda',
            delivery: item.delivery || item.status || 'Ongoing',
            images
          };
        });
      }
      projects = { ...builtInProjects, ...managedProjects };
      projectKeys = Object.keys(projects);
      projectKey = Object.prototype.hasOwnProperty.call(projects, requestedProject) ? requestedProject : projectKeys[0];
      project = projects[projectKey];
    }

    document.getElementById('previous-image').addEventListener('click', () => showImage(currentImage - 1));
    document.getElementById('next-image').addEventListener('click', () => showImage(currentImage + 1));
    document.getElementById('stage-open').addEventListener('click', openLightbox);
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      if (event.key === 'ArrowLeft') showImage(currentImage - 1);
      if (event.key === 'ArrowRight') showImage(currentImage + 1);
    });

    const navToggle = document.getElementById('nav-toggle');
    const siteNav = document.getElementById('site-nav');
    navToggle.addEventListener('click', () => {
      const isOpen = siteNav.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
      navToggle.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
    });
    siteNav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
      siteNav.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    }));

    fetch('data/projects.json', { cache: 'no-store' })
      .then(response => response.ok ? response.json() : [])
      .then(records => mergeManagedProjects(records))
      .catch(() => mergeManagedProjects([]))
      .finally(initializePage);
  </script>
</body>
</html>
