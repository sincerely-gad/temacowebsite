<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMACO — Product Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f4;
    --surface: #ffffff;
    --surface2: #ebebeb;
    --border: #d6d6d6;
    --accent: #e8620a;
    --text: #1a1a1a;
    --muted: #767676;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─────────────────────────────────────────── */
  header {
    border-bottom: 1px solid rgba(255,255,255,.28);
    padding: 0 48px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #f56421;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  .logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .logo img {
    display: block;
    max-width: 140px;
    height: auto;
  }

  .header-tag {
    font-size: .67rem;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(255,255,255,.82);
  }

  .catalogue-nav {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .catalogue-nav a {
    color: #fff;
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .13em;
    text-decoration: none;
    text-transform: uppercase;
    transition: color .2s;
  }

  .catalogue-nav a:hover,
  .catalogue-nav a:focus-visible,
  .catalogue-nav a[aria-current="page"] {
    color: #fff;
    border-bottom: 3px solid #fff;
  }

  .nav-toggle {
    display: none;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,.7);
    background: transparent;
    color: #fff;
    font: inherit;
    font-size: 1.35rem;
    cursor: pointer;
  }

  /* ─── CATALOGUE GRID ─────────────────────────────────── */
  #catalogue-view {
    padding: 56px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-label {
    font-size: .62rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 5vw, 4.2rem);
    letter-spacing: .04em;
    line-height: 1;
    margin-bottom: 40px;
  }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: .67rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: all .2s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,98,10,.06);
  }

  .catalogue-tools {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 14px;
    align-items: end;
    margin-bottom: 18px;
    padding: 22px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .catalogue-field { display: grid; gap: 8px; }
  .catalogue-field > span {
    color: var(--muted);
    font-size: .64rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .catalogue-search-wrap { position: relative; }
  .catalogue-search-wrap input {
    width: 100%;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 0;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: .88rem;
    outline: none;
  }
  .catalogue-search-wrap input { padding: 0 48px 0 15px; }
  .catalogue-search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,98,10,.11);
  }

  .search-clear {
    position: absolute;
    top: 50%;
    right: 7px;
    width: 34px;
    height: 34px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
  }
  .search-clear[hidden] { display: none; }
  .search-clear:hover { color: var(--accent); }

  .catalogue-result-count {
    min-width: 112px;
    margin: 0 0 14px;
    color: var(--muted);
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-align: right;
    text-transform: uppercase;
  }

  .catalogue-hint {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: .78rem;
  }

  .catalogue-empty {
    grid-column: 1 / -1;
    padding: 58px 24px;
    border: 1px dashed var(--border);
    background: var(--surface);
    text-align: center;
  }
  .catalogue-empty strong { display: block; margin-bottom: 8px; font-size: 1.08rem; }
  .catalogue-empty p { margin: 0; color: var(--muted); font-size: .86rem; }

  .card-img-wrap { position: relative; }
  .image-pending-note {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 6px 9px;
    background: rgba(26,26,26,.82);
    color: #fff;
    font-size: .56rem;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 34px 22px;
  }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 38px 22px;
  }

  .category-card {
    position: relative;
    min-width: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    text-align: left;
    transition: transform .28s ease;
  }
  .category-card:hover { transform: translateY(-4px); }
  .category-card-media {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 24px;
    background: #eeeae5;
  }
  .category-card img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1;
  }
  .category-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .category-card-content {
    display: block;
    padding: 17px 5px 0;
  }
  .category-card-name {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.08rem;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.3;
  }
  .category-card-description {
    display: block;
    margin-top: 7px;
    color: var(--muted);
    font-size: .78rem;
    line-height: 1.5;
  }
  .category-card-link {
    display: block;
    margin-top: 13px;
    color: var(--accent);
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .category-hero {
    position: relative;
    width: 100vw;
    min-height: 330px;
    margin: -56px 0 34px calc(50% - 50vw);
    overflow: hidden;
    border-radius: 0;
    background: #1a1714;
    color: #fff;
  }
  .category-hero[hidden] { display: none; }
  .category-hero-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .64;
  }
  .category-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(18,15,12,.92), rgba(18,15,12,.28));
  }
  .category-hero-content {
    position: relative;
    z-index: 2;
    display: flex;
    min-height: 330px;
    max-width: 690px;
    flex-direction: column;
    justify-content: center;
    padding: 48px;
  }
  .category-hero-eyebrow {
    margin: 0 0 10px;
    color: #ff9b5b;
    font-size: .64rem;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .category-hero-title {
    margin: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.3rem, 7vw, 6.2rem);
    font-weight: 400;
    letter-spacing: .035em;
    line-height: .95;
  }
  .category-hero-description {
    max-width: 580px;
    margin: 16px 0 0;
    color: rgba(255,255,255,.8);
    font-size: .9rem;
    line-height: 1.65;
  }
  .category-hero-back {
    width: fit-content;
    margin-top: 24px;
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.62);
    background: transparent;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .category-hero-back:hover,
  .category-hero-back:focus-visible { border-color: #fff; background: #fff; color: #1a1714; }

  .collection-landing-heading { margin: 0 0 22px; }
  .collection-landing-heading p { margin: 0 0 7px; color: var(--accent); font-size: .62rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .collection-landing-heading h2 { margin: 0; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; font-weight: 400; letter-spacing: .04em; }

  .card {
    position: relative;
    display: block;
    min-width: 0;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    overflow: visible;
    border: 0;
    text-decoration: none;
    transition: transform .28s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .card.is-new { box-shadow: none; }
  .card-new-badge {
    position: absolute; top: 16px; left: 16px; z-index: 3;
    padding: 7px 12px; background: var(--accent); color: #fff;
    font-size: .6rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    box-shadow: 0 8px 18px rgba(232,98,10,.28);
  }

  .card-img-wrap {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 24px;
    background: #eeeae5;
  }
  .card-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: none;
    opacity: 1;
    transform: scale(1);
    transition: opacity .38s ease, transform .55s cubic-bezier(.2,.7,.2,1);
  }
  .card-img-secondary { opacity: 0; }
  .card.has-hover-image:hover .card-img-primary,
  .card.has-hover-image:focus-visible .card-img-primary { opacity: 0; }
  .card.has-hover-image:hover .card-img-secondary,
  .card.has-hover-image:focus-visible .card-img-secondary { opacity: 1; transform: scale(1.025); }
  .card:not(.has-hover-image):hover .card-img-primary { transform: scale(1.035); }
  .card:focus-visible { outline: 3px solid rgba(245,100,33,.45); outline-offset: 4px; }

  .card-body { padding: 17px 5px 0; }

  .card-cat {
    font-size: .58rem; letter-spacing: .25em; text-transform: uppercase;
    color: #817a73; margin-bottom: 7px;
  }

  .card-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.02rem;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .card-sku {
    margin: 0;
    color: #5f5953;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .04em;
  }

  .card-spec-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 11px;
  }
  .card-spec {
    display: inline-flex;
    gap: 5px;
    padding: 6px 8px;
    border: 1px solid #ddd7d0;
    background: rgba(255,255,255,.55);
    color: #67615b;
    font-size: .64rem;
    line-height: 1.2;
  }
  .card-spec strong { color: var(--text); font-weight: 500; }

  .card-desc {
    display: none;
  }

  .card-footer {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    margin-top: 15px; padding-top: 13px; border-top: 1px solid #ddd7d0;
  }

  .card-price {
    display: inline;
    color: #716a64;
    font-size: .66rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .card-cta {
    font-size: .64rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
    color: var(--accent); transition: color .2s;
  }
  .card:hover .card-cta { color: var(--accent); }
  .card-arrow { display: inline-block; transition: transform .2s; }
  .card:hover .card-arrow { transform: translateX(4px); }

  /* ─── DETAIL — FULL PAGE ─────────────────────────────── */
  #detail-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: none; flex-direction: column; background: #fff; overflow-y: auto;
  }
  #detail-overlay.open { display: flex; animation: fadeIn .22s ease; }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  /* top bar */
  .detail-topbar {
    flex-shrink: 0; height: 58px;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 40px; display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }

  .detail-breadcrumb {
    font-size: .67rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .detail-breadcrumb strong { color: var(--text); font-weight: 400; }

  .detail-close-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: .7rem; letter-spacing: .15em;
    text-transform: uppercase; padding: 8px 20px; cursor: pointer; transition: all .2s;
  }
  .detail-close-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* two-col body */
  .detail-body {
    flex: none; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr);
    min-height: calc(100vh - 58px);
  }

  /* ── LEFT: sticky image gallery ── */
  .detail-gallery {
    background: #f3f1ee; border-right: 1px solid #e7e2dc;
    display: flex; flex-direction: column; min-width: 0;
  }

  .gallery-main {
    flex: 1; position: relative; overflow: hidden;
    cursor: zoom-in; min-height: 540px;
    background: #f3f1ee;
  }
  .gallery-main > img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    padding: clamp(24px, 5vw, 76px);
    transition: transform .5s ease;
  }
  .gallery-main:hover > img { transform: scale(1.04); }

  .gallery-badge {
    position: absolute; top: 18px; left: 20px;
    background: var(--accent); color: #fff;
    font-size: .58rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    padding: 5px 12px; pointer-events: none;
  }

  .gallery-nav {
    position: absolute; bottom: 50%; transform: translateY(50%);
    width: 100%; display: flex; justify-content: space-between;
    padding: 0 12px; pointer-events: none;
  }

  .gallery-nav-btn {
    background: rgba(255,255,255,.85); border: 1px solid var(--border);
    color: var(--text); width: 36px; height: 36px; cursor: pointer;
    font-size: 1rem; display: flex; align-items: center; justify-content: center;
    transition: all .2s; pointer-events: all;
  }
  .gallery-nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .gallery-zoom-hint {
    position: absolute; bottom: 14px; right: 16px;
    background: rgba(255,255,255,.88); border: 1px solid var(--border);
    color: var(--muted); font-size: .58rem; letter-spacing: .14em;
    text-transform: uppercase; padding: 5px 10px; pointer-events: none;
  }

  .gallery-counter {
    position: absolute; bottom: 14px; left: 16px;
    background: rgba(255,255,255,.88); border: 1px solid var(--border);
    color: var(--muted); font-size: .58rem; letter-spacing: .12em;
    text-transform: uppercase; padding: 5px 10px; pointer-events: none;
  }

  /* thumbnail strip */
  .gallery-thumbs {
    flex-shrink: 0; display: flex; gap: 5px;
    padding: 10px 12px; background: #fff; border-top: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .gallery-thumbs::-webkit-scrollbar { display: none; }

  .thumb {
    width: 76px; height: 60px; flex-shrink: 0;
    border: 2px solid transparent; overflow: hidden;
    cursor: pointer; transition: border-color .2s; background: var(--surface2);
  }
  .thumb.active { border-color: var(--accent); }
  .thumb:hover:not(.active) { border-color: #bbb; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .thumb:hover img { transform: scale(1.08); }

  /* ── RIGHT: scrollable info ── */
  .detail-info { display: flex; align-items: center; background: var(--surface); }

  .detail-info-inner { width: 100%; padding: 70px clamp(36px, 6vw, 96px); animation: fadeUp .35s ease both; }

  .detail-cat {
    font-size: .6rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }

  .detail-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.4rem, 6vw, 6.6rem); letter-spacing: .035em;
    line-height: 1; color: var(--text); margin-bottom: 6px;
  }

  .detail-sku { font-size: .66rem; color: var(--muted); letter-spacing: .14em; margin-bottom: 26px; }

  .detail-price-row {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 28px; padding-bottom: 24px;
    border-bottom: 2px solid var(--accent);
  }

  .detail-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem; color: var(--accent); letter-spacing: .06em;
  }

  .detail-price-note { font-size: .7rem; color: var(--muted); }

  .detail-section-title {
    font-size: .58rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px; margin-top: 30px;
  }

  .detail-description { font-size: .88rem; line-height: 1.8; color: #555; }

  .detail-intro-label { display: block; margin: 34px 0 10px; color: var(--muted); font-size: .58rem; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }
  .detail-lower { padding: 88px clamp(28px, 6vw, 92px) 110px; background: #fff; }
  .detail-lower-grid { display: grid; grid-template-columns: minmax(260px, .78fr) minmax(0, 1.22fr); gap: clamp(48px, 8vw, 120px); max-width: 1320px; margin: 0 auto; }
  .detail-block-title { margin: 0 0 28px; font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 3vw, 3.2rem); font-weight: 400; letter-spacing: .04em; }
  .detail-lower .specs-table { border-top: 1px solid var(--border); }
  .detail-lower .showcase-grid { margin-top: 0; }
  .detail-datasheet-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .related-products { max-width: 1320px; margin: 96px auto 0; padding-top: 54px; border-top: 1px solid var(--border); }
  .detail-lower > .related-products { margin-top: 0; }
  .related-heading-row { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
  .related-heading-row .detail-block-title { margin: 0; }
  .related-heading-row p { color: var(--muted); font-size: .76rem; }
  .related-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
  .related-card { color: var(--text); text-decoration: none; }
  .related-card-media { aspect-ratio: 4 / 5; overflow: hidden; background: #f3f1ee; }
  .related-card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s ease; }
  .related-card:hover img { transform: scale(1.035); }
  .related-card-copy { padding: 16px 2px 0; }
  .related-card-copy span { color: var(--accent); font-size: .56rem; letter-spacing: .2em; text-transform: uppercase; }
  .related-card-copy h3 { margin: 7px 0 5px; font-size: 1rem; font-weight: 500; }
  .related-card-copy p { color: var(--muted); font-size: .7rem; }

  /* specs table */
  .specs-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .specs-table tr { border-bottom: 1px solid var(--border); }
  .specs-table td { padding: 11px 0; vertical-align: top; }
  .specs-table td:first-child {
    color: var(--muted); width: 42%; font-size: .7rem;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .specs-table td:last-child { color: var(--text); font-weight: 400; }

  /* ── SHOWCASE PHOTO GRID ── */
  .showcase-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px;
  }

  .showcase-item {
    overflow: hidden; background: var(--surface2);
    border: 1px solid var(--border); cursor: zoom-in;
    position: relative; aspect-ratio: 4/3; transition: border-color .2s;
  }
  .showcase-item:hover { border-color: var(--accent); }
  .showcase-item:first-child { grid-column: span 2; aspect-ratio: 16/7; }
  .showcase-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .showcase-item:hover img { transform: scale(1.05); }

  .showcase-label {

const SOFTSCAPE_CATEGORIES = new Set([
  "Nursery & Plants",
  "Indigenous Species",
  "Hydroseeding",
  "Erosion Control",
  "Soil & Compost",
  "Irrigation"

function productMatchesScope(product, scope = activeScope) {
  if (scope === "softscape") return SOFTSCAPE_CATEGORIES.has(product.category);
  if (scope === "hardscape") return !SOFTSCAPE_CATEGORIES.has(product.category);
  return true;
}

function buildCatalogueUrl({ category = activeCategory, collection = activeCollection, product = "" } = {}) {
  const params = new URLSearchParams();
  if (activeScope !== "all") params.set("scope", activeScope);
  if (product !== "") {
    params.set("product", product);
  } else {
    if (category !== "all") params.set("category", category);
    if (collection !== "all") params.set("collection", collection);
  }
  const query = params.toString();
  return window.location.pathname + (query ? `?${query}` : "");
}

function getNewProductExpiry(product) {
  const storedExpiry = Date.parse(product.newUntil || "");
  if (!Number.isNaN(storedExpiry)) return storedExpiry;
  const createdAt = Date.parse(product.createdAt || "");
  return Number.isNaN(createdAt) ? 0 : createdAt + NEW_PRODUCT_DURATION_MS;
}

function isProductNew(product) {
  return Boolean(product.isNew) && getNewProductExpiry(product) > Date.now();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[char]);
}

async function loadManagedProducts() {
  const fetchJson = async (url, fallback) => {
    try {
      const response = await fetch(url, { cache: 'no-store' });
      return response.ok ? await response.json() : fallback;
    } catch (_) {
      return fallback;
    }
  };

  const [managed, overrides] = await Promise.all([
    fetchJson('data/products.json', []),
    fetchJson('data/content-overrides.json', { products: {} })
  ]);

  if (Array.isArray(managed)) {
    const existingSkus = new Set(products.map(product => String(product.sku).toLowerCase()));
    const additions = managed
      .filter(product => product && product.name && product.sku && Array.isArray(product.gallery) && product.gallery.length)
      .filter(product => !existingSkus.has(String(product.sku).toLowerCase()))
      .map(product => {
        const normalized = { ...product, id: Number(product.id) };
        const activeNewLabel = isProductNew(normalized);
        return { ...normalized, isNew: activeNewLabel, badge: activeNewLabel ? "New Product" : "" };
      });
    products.unshift(...additions);
  }

  const productOverrides = overrides && typeof overrides.products === 'object' ? overrides.products : {};
  products.forEach(product => {
    const sku = String(product.sku || '').toUpperCase();
    const replacement = productOverrides[sku]?.image;
    if (!replacement) return;
    const remainingGallery = Array.isArray(product.gallery) ? product.gallery.slice(1) : [];
    product.gallery = [{ url: replacement, label: `${product.name} replacement image` }, ...remainingGallery];
    product.imagePending = false;
  });
}

function getProductCollection(product) {
  const category = product.category || "Other";
  const text = `${product.name || ""} ${product.sku || ""}`.toLowerCase();
  if (product.collection) return product.collection;
  if (category === "Pavers") {
    if (/tp15|tp16|tactile/.test(text)) return "Tactile Pavers";
    if (/tp18|grass/.test(text)) return "Permeable Pavers";
    if (/tp10|tp11|stadium/.test(text)) return "Large Format Slabs";
    if (/tp12|tp13|inzovu/.test(text)) return "Inzovu Collection";
    return "Decorative Pavers";
  }
  if (category === "Blocks") return /hollow/.test(text) ? "Hollow Blocks" : /solid/.test(text) ? "Solid Blocks" : "Concrete Blocks";
  if (category === "Kerbs") return /design/.test(text) && !/non design/.test(text) ? "Designed Kerbs" : "Standard Kerbs";
  if (category === "Drainage") return /slotted/.test(text) ? "Slotted Drainage" : /watergo/.test(text) ? "Watergo System" : "Perforated Drainage";
  if (category === "Cladding") return /stone/.test(text) ? "Stone Cladding" : "Decorative Cladding";
  if (category === "Tiles") return "Floor Tiles";
  if (category === "Breeze Bricks") return "Ventilation Blocks";
  if (category === "Planters") return "Concrete Planters";
  if (category === "Paving Bricks") return "Brick Pavers";
  return category;
}

function getCategoryDisplayName(category) {
  return category === "Breeze Bricks" ? "Ventilation Blocks" : category;
}

function getCategories() {
  const preferredOrder = ["Pavers", "Tiles", "Drainage", "Breeze Bricks", "Kerbs", "Planters", "Nursery & Plants", "Indigenous Species", "Paving Bricks", "Blocks", "Cladding"];
  const categories = [...new Set(products.map(product => product.category).filter(Boolean))];
  return categories.sort((a, b) => {
    const aIndex = preferredOrder.indexOf(a);
    const bIndex = preferredOrder.indexOf(b);
    if (aIndex !== -1 || bIndex !== -1) {
      if (aIndex === -1) return 1;
      if (bIndex === -1) return -1;
      return aIndex - bIndex;
    }
    return a.localeCompare(b);
  });
}

    const scopeImage = isSoftscape
      ? (representative?.gallery?.[0]?.url || PRODUCT_IMAGE_PENDING)
      : "img/pavers.jpeg";
    const eyebrow = isSoftscape ? "TEMACO Softscape" : isHardscape ? "TEMACO Hardscape" : "TEMACO Product Catalogue";
    const title = isSoftscape ? "Softscape Products" : isHardscape ? "Hardscape Products" : "Our Products";
    const description = isSoftscape
      ? "Explore TEMACO nursery plants and indigenous species for living, resilient landscapes."
      : isHardscape
        ? "Explore TEMACO manufactured materials for durable architectural, construction and landscape projects."
        : "Explore TEMACO product categories, collections and individual models for construction and landscape projects.";
    document.title = `${title} | TEMACO`;
    hero.hidden = false;
    hero.innerHTML = `
      <img class="category-hero-image" src="${escapeHtml(scopeImage)}" alt="" aria-hidden="true">
      <div class="category-hero-content">
        <p class="category-hero-eyebrow">${eyebrow}</p>
        <h2 class="category-hero-title" id="category-hero-title">${title}</h2>
        <p class="category-hero-description">${description}</p>
      </div>`;
    return;
  }
  const categoryProducts = products.filter(product => product.category === activeCategory);
  const representative = categoryProducts.find(product => product.coverPriority)
    || categoryProducts.find(product => !product.imagePending)
    || categoryProducts[0];
  const image = representative?.gallery?.[0]?.url || PRODUCT_IMAGE_PENDING;
  hero.hidden = false;
  hero.innerHTML = `
    <img class="category-hero-image" src="${escapeHtml(image)}" alt="" aria-hidden="true">
    <div class="category-hero-content">
      <p class="category-hero-eyebrow">TEMACO Product Category</p>
      <h2 class="category-hero-title" id="category-hero-title">${escapeHtml(getCategoryDisplayName(activeCategory))}</h2>
      <p class="category-hero-description">${escapeHtml(categoryDescriptions[activeCategory] || `Explore TEMACO ${activeCategory.toLowerCase()} collections and product models.`)}</p>
      <button class="category-hero-back" type="button" data-show-categories>&larr; All ${activeScope === "all" ? "product" : activeScope} categories</button>
    </div>`;
}

function renderCategoryLanding(categories) {
  const cards = categories.map(category => {
    const categoryProducts = products.filter(product => product.category === category);
    const representative = categoryProducts.find(product => product.coverPriority)
      || categoryProducts.find(product => !product.imagePending)
      || categoryProducts[0];
    const image = representative?.gallery?.[0]?.url || PRODUCT_IMAGE_PENDING;
    return `
      <button class="category-card" type="button" data-open-category="${escapeHtml(category)}" aria-label="Browse ${escapeHtml(getCategoryDisplayName(category))}">
        <span class="category-card-media">
          <img class="category-card-primary" src="${escapeHtml(image)}" alt="${escapeHtml(category)} product collection" loading="lazy">
        </span>
        <span class="category-card-content">
          <span class="category-card-name">${escapeHtml(getCategoryDisplayName(category))}</span>
          <span class="category-card-description">${escapeHtml(categoryDescriptions[category] || `Explore TEMACO ${category.toLowerCase()} products.`)}</span>
          <span class="category-card-link">Explore category &rarr;</span>
        </span>
      </button>`;
  }).join('');
  const grid = document.getElementById('product-grid');
  grid.className = 'category-grid';
  grid.innerHTML = cards;
}

function renderCollectionLanding() {
  const categoryProducts = products.filter(product => product.category === activeCategory);
  const collections = [...new Set(categoryProducts.map(getProductCollection))];
  const cards = collections.map(collection => {
    const collectionProducts = categoryProducts.filter(product => getProductCollection(product) === collection);
    const representative = collectionProducts.find(product => !product.imagePending) || collectionProducts[0];
    const image = representative?.gallery?.[0]?.url || PRODUCT_IMAGE_PENDING;
    return `
      <button class="category-card" type="button" data-open-collection="${escapeHtml(collection)}" aria-label="Browse ${escapeHtml(collection)}">
        <span class="category-card-media">
          <img class="category-card-primary" src="${escapeHtml(image)}" alt="${escapeHtml(collection)} collection" loading="lazy">
        </span>
        <span class="category-card-content">
          <span class="category-card-name">${escapeHtml(collection)}</span>
          <span class="category-card-description">View the ${escapeHtml(collection.toLowerCase())} models available from TEMACO.</span>
          <span class="category-card-link">View collection &rarr;</span>
        </span>
      </button>`;
  }).join('');
  const grid = document.getElementById('product-grid');
  grid.className = 'category-grid';
  grid.innerHTML = `
    <div class="collection-landing-heading" style="grid-column:1/-1">
      <p>Browse by collection</p>
      <h2>Choose a ${escapeHtml(getCategoryDisplayName(activeCategory))} Collection</h2>
    </div>
    ${cards}`;
}

function renderGrid() {
  // Show only products of the same type (category) as the clicked product
  // Show all tile types (TT1–TT7) in the grid when any tile is selected
  const categories = getCategories();
  if (activeCategory !== "all" && activeCategory !== "Pavers" && activeCollection === "all") {
    const categoryCollections = [...new Set(products
      .filter(product => product.category === activeCategory)
      .map(getProductCollection))];
    if (categoryCollections.length === 1) activeCollection = categoryCollections[0];
  }
  renderCategoryHero();
  if (activeCategory === "all") {
    renderCategoryLanding(categories);
    return;
  }
  if (activeCategory !== "all" && activeCategory !== "Pavers" && activeCollection === "all") {
    const categoryProducts = products.filter(product => product.category === activeCategory);
    renderCollectionLanding();
    document.title = `${getCategoryDisplayName(activeCategory)} | TEMACO Product Catalogue`;
    return;
  }
  const list = products.filter(product => {
    const matchesCategory = activeCategory === "all" || product.category === activeCategory;
    const matchesCollection = activeCollection === "all" || getProductCollection(product) === activeCollection;
    return matchesCategory && matchesCollection;
  }).sort((a, b) =>
    Number(Boolean(b.coverPriority)) - Number(Boolean(a.coverPriority))
    || Number(a.imagePending) - Number(b.imagePending)
  );
  document.title = `${activeCollection === "all" ? activeCategory === "all" ? 'Products' : getCategoryDisplayName(activeCategory) : activeCollection} | TEMACO Product Catalogue`;
  const productGrid = document.getElementById('product-grid');
  productGrid.className = 'grid';
  productGrid.innerHTML = list.length ? list.map(p => {
    const primaryImage = p.gallery[0];
    const secondaryImage = p.gallery[1];
    const preferredSpecLabels = ['Size', 'Thickness', 'Pieces per sqm', 'Weight per piece'];
    const visibleSpecs = (Array.isArray(p.specs) ? p.specs : [])
      .filter(([label, value]) => preferredSpecLabels.includes(label) && value)
      .sort(([labelA], [labelB]) => preferredSpecLabels.indexOf(labelA) - preferredSpecLabels.indexOf(labelB))
      .slice(0, 2);
    return `
    <a class="card ${p.isNew ? 'is-new' : ''} ${secondaryImage ? 'has-hover-image' : ''}" href="${escapeHtml(buildCatalogueUrl({ product: p.id }))}" onclick="event.preventDefault(); handleProductClick(${Number(p.id)})" aria-label="View ${escapeHtml(p.name)} details">
      ${p.isNew ? '<span class="card-new-badge">New Product</span>' : ''}
      <div class="card-img-wrap">
        <img class="card-img card-img-primary" src="${escapeHtml(primaryImage.url)}" alt="${escapeHtml(p.name)}" loading="lazy">
        ${secondaryImage ? `<img class="card-img card-img-secondary" src="${escapeHtml(secondaryImage.url)}" alt="${escapeHtml(p.name)} alternate view" loading="lazy" onerror="this.closest('.card').classList.remove('has-hover-image'); this.remove();">` : ''}
        ${p.imagePending ? '<span class="image-pending-note">Image coming soon</span>' : ''}
      </div>
      <div class="card-body">
        <p class="card-cat">${escapeHtml(getCategoryDisplayName(p.category))}${getCategoryDisplayName(p.category) === getProductCollection(p) ? '' : ` / ${escapeHtml(getProductCollection(p))}`}</p>
        <h2 class="card-name">${escapeHtml(p.name)}</h2>
        <p class="card-sku">Product code: ${escapeHtml(p.sku || 'Available on request')}</p>
        ${visibleSpecs.length ? `<div class="card-spec-list">${visibleSpecs.map(([label, value]) => `<span class="card-spec">${escapeHtml(label)} <strong>${escapeHtml(value)}</strong></span>`).join('')}</div>` : ''}
        <p class="card-desc">${escapeHtml(p.description)}</p>
        <div class="card-footer">
          <span class="card-price">Request a quote</span>
          <span class="card-cta">View Product <span class="card-arrow">&rarr;</span></span>
        </div>
      </div>
    </a>`;
  }).join('') : `
    <div class="catalogue-empty">
      <strong>No products found</strong>
      <p>Try another product name, code, dimension, or category.</p>
    </div>`;
  scheduleNewProductRefresh();
}

function scheduleNewProductRefresh() {
  if (newProductRefreshTimer) clearTimeout(newProductRefreshTimer);
  const expiries = products.filter(product => product.isNew).map(getNewProductExpiry).filter(expiry => expiry > Date.now());
  if (!expiries.length) return;
  const delay = Math.min(Math.min(...expiries) - Date.now() + 100, 2147483647);
  newProductRefreshTimer = setTimeout(() => {
    products.forEach(product => {
      if (product.isNew && !isProductNew(product)) {
        product.isNew = false;
        product.badge = "";
      }
    });
    renderGrid();
  }, Math.max(100, delay));
}

// Update URL, set heading, and open detail overlay
function handleProductClick(id) {
  window.history.replaceState({}, '', buildCatalogueUrl({ product: id }));
  openDetail(id);
}

// ── FILTER ────────────────────────────────────────────────────────────────────
// ── GALLERY ───────────────────────────────────────────────────────────────────
function setMainImage(idx) {
  currentIdx = (idx + currentGallery.length) % currentGallery.length;
  const img = document.getElementById('gallery-main-img');
  img.src = currentGallery[currentIdx].url;
  img.alt = currentGallery[currentIdx].label;
  document.getElementById('gallery-counter').textContent = `${currentIdx + 1} / ${currentGallery.length}`;
  document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === currentIdx));
}

function buildThumbs(gallery) {
  document.getElementById('gallery-thumbs').innerHTML = gallery.map((g, i) => `
    <div class="thumb ${i === 0 ? 'active' : ''}" onclick="setMainImage(${i})">
      <img src="${g.url}" alt="${escapeHtml(g.label)}" loading="lazy">
    </div>
  `).join('');
}

document.getElementById('prev-btn').addEventListener('click', e => { e.stopPropagation(); setMainImage(currentIdx - 1); });
document.getElementById('next-btn').addEventListener('click', e => { e.stopPropagation(); setMainImage(currentIdx + 1); });
document.getElementById('gallery-main').addEventListener('click', () => openLightbox(currentGallery[currentIdx].url));

// ── OPEN DETAIL ───────────────────────────────────────────────────────────────
function openDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  document.getElementById('detail-crumb').textContent = p.name;

  // setup gallery
  currentGallery = p.gallery;
  currentIdx = 0;
  const mainImg = document.getElementById('gallery-main-img');
  mainImg.src = p.gallery[0].url;
  mainImg.alt = p.gallery[0].label;
  document.getElementById('gallery-counter').textContent = `1 / ${p.gallery.length}`;

  const badge = document.getElementById('gallery-badge');
  if (p.badge) { badge.textContent = p.badge; badge.style.display = ''; }
  else { badge.style.display = 'none'; }

  buildThumbs(p.gallery);

  // info panel
  const datasheetIsPdf = /\.pdf(?:$|\?)/i.test(p.datasheet || '');
  const datasheetMarkup = p.datasheet
    ? (datasheetIsPdf
      ? `<a class="datasheet-wrap" href="${p.datasheet}" target="_blank" rel="noopener"><span class="datasheet-zoom-hint">Open product PDF datasheet →</span></a>`
      : `<div class="datasheet-wrap" onclick="openLightbox('${p.datasheet}')"><img src="${p.datasheet}" alt="${escapeHtml(p.name)} datasheet" loading="lazy"><span class="datasheet-zoom-hint">Click to enlarge</span></div>`)
    : '<p class="detail-description">Contact our team for the latest technical datasheet.</p>';
  document.getElementById('detail-inner').innerHTML = `
    <p class="detail-cat">${escapeHtml(getCategoryDisplayName(p.category))}${getCategoryDisplayName(p.category) === getProductCollection(p) ? '' : ` / ${escapeHtml(getProductCollection(p))}`}</p>
    <h2 class="detail-name">${escapeHtml(p.name)}</h2>
    <p class="detail-sku">SKU: ${escapeHtml(p.sku)}</p>

    <div class="detail-price-row">
      <span class="detail-price">${escapeHtml(p.price)}</span>
      <span class="detail-price-note">${escapeHtml(p.priceNote)}</span>
    </div>

    <p class="detail-section-title">Description</p>
    <p class="detail-description">${escapeHtml(p.description)}</p>

    <p class="detail-section-title">Technical Specifications</p>
    <table class="specs-table">
      ${p.specs.length ? p.specs.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('') : '<tr><td>Availability</td><td>Contact our team for specifications</td></tr>'}
    </table>

    <p class="detail-section-title">Product Showcase</p>
    <div class="showcase-grid">
      ${p.gallery.map(g => `
        <div class="showcase-item" onclick="openLightbox('${g.url}')">
          <img src="${g.url}" alt="${escapeHtml(g.label)}" loading="lazy">
          <span class="showcase-label">${escapeHtml(g.label)}</span>
        </div>
      `).join('')}
    </div>

    <p class="detail-section-title">Datasheet</p>
    ${datasheetMarkup}

    <div class="dev-note" hidden>
      <strong>💡 Developer note</strong>
      Replace the <code>gallery[]</code> and <code>datasheet</code> fields in each product with your own image URLs.
    </div>

    <div class="detail-cta-row">
      <a class="btn-primary" href="index.html?quoteProduct=${encodeURIComponent(p.name)}&sku=${encodeURIComponent(p.sku)}&category=${encodeURIComponent(p.category)}#contact">Request Quote</a>
      ${p.datasheet ? `<a class="btn-secondary" href="${p.datasheet}" target="_blank" rel="noopener">View Datasheet</a><a class="btn-secondary" href="${p.datasheet}" download>Download Datasheet</a>` : ''}
    </div>
  `;

  // Recompose the detail view as a product-led page: gallery and overview first,
  // followed by specifications, showcase imagery and related products.
  document.getElementById('detail-inner').innerHTML = `
    <p class="detail-cat">${escapeHtml(getCategoryDisplayName(p.category))}${getCategoryDisplayName(p.category) === getProductCollection(p) ? '' : ` / ${escapeHtml(getProductCollection(p))}`}</p>
    <h2 class="detail-name">${escapeHtml(p.name)}</h2>
    <p class="detail-sku">SKU: ${escapeHtml(p.sku)}</p>
    <div class="detail-price-row">
      <span class="detail-price">${escapeHtml(p.price)}</span>
      <span class="detail-price-note">${escapeHtml(p.priceNote)}</span>
    </div>
    <span class="detail-intro-label">Technical specifications</span>
    <table class="specs-table">
      ${p.specs.length ? p.specs.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('') : '<tr><td>Availability</td><td>Contact our team for specifications</td></tr>'}
    </table>
    <div class="detail-cta-row">
      <a class="btn-primary" href="index.html?quoteProduct=${encodeURIComponent(p.name)}&sku=${encodeURIComponent(p.sku)}&category=${encodeURIComponent(p.category)}#contact">Request Quote</a>
      ${p.datasheet ? `<a class="btn-secondary" href="${p.datasheet}" target="_blank" rel="noopener">View Datasheet</a>` : ''}
    </div>
  `;

  const related = products.filter(product => product.id !== p.id && product.category === p.category).slice(0, 4);
  document.getElementById('detail-lower').innerHTML = `
    ${related.length ? `
      <section class="related-products" aria-labelledby="related-products-title">
        <div class="related-heading-row">
          <div>
            <p class="detail-cat">Explore the collection</p>
            <h2 class="detail-block-title" id="related-products-title">Related products</h2>
          </div>
          <p>More from ${escapeHtml(getCategoryDisplayName(p.category))}</p>
        </div>
        <div class="related-grid">
          ${related.map(item => `
            <a class="related-card" href="${buildCatalogueUrl({ product: item.id })}" onclick="event.preventDefault(); handleProductClick('${item.id}')">
              <div class="related-card-media"><img src="${item.gallery[0].url}" alt="${escapeHtml(item.name)}" loading="lazy"></div>
              <div class="related-card-copy">
                <span>${escapeHtml(getProductCollection(item))}</span>
                <h3>${escapeHtml(item.name)}</h3>
                <p>Product code: ${escapeHtml(item.sku || 'Available on request')}</p>
              </div>
            </a>
          `).join('')}
        </div>
      </section>` : ''}
  `;

  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-overlay').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

// ── CLOSE DETAIL ─────────────────────────────────────────────────────────────
function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('close-btn').addEventListener('click', closeDetail);

// ── LIGHTBOX ──────────────────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox-close').addEventListener('click', e => { e.stopPropagation(); document.getElementById('lightbox').classList.remove('open'); });

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox').classList.contains('open');
  const det = document.getElementById('detail-overlay').classList.contains('open');
  if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('open'); if (!lb) closeDetail(); }
  if (det && !lb) {
    if (e.key === 'ArrowRight') setMainImage(currentIdx + 1);
    if (e.key === 'ArrowLeft')  setMainImage(currentIdx - 1);
  }
});

// ── URL PARAM PARSING ────────────────────────────────────────────────────────
function getQueryParams() {
  const params = {};
  new URLSearchParams(window.location.search).forEach((value, key) => {
    params[key] = value;
  });
  return params;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const navToggle = document.getElementById('catalogue-nav-toggle');
  const catalogueNav = document.getElementById('catalogue-nav');
  navToggle.addEventListener('click', () => {
    const isOpen = catalogueNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', String(isOpen));
    navToggle.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
  });
  catalogueNav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
    catalogueNav.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
    navToggle.setAttribute('aria-label', 'Open navigation');
  }));

  await loadManagedProducts();
  products.splice(0, products.length, ...products.filter(product => product.imagePending !== true));
  const params = getQueryParams();
  const requestedScope = String(params.scope || "").trim().toLowerCase();
  if (requestedScope === "hardscape" || requestedScope === "softscape") {
    activeScope = requestedScope;
    const scopedProducts = products.filter(product => productMatchesScope(product, activeScope));
    products.splice(0, products.length, ...scopedProducts);
  }
  if (params.category) {
    const requestedCategory = params.category.trim().toLowerCase();
    const matchingCategory = products
      .map(product => product.category)
      .find(category => category && category.toLowerCase() === requestedCategory);
    if (matchingCategory) activeCategory = matchingCategory;
  }
  if (params.collection && activeCategory !== "all") {
    const requestedCollection = params.collection.trim().toLowerCase();
    const matchingCollection = products
      .filter(product => product.category === activeCategory)
      .map(getProductCollection)
      .find(collection => collection.toLowerCase() === requestedCollection);
    if (matchingCollection) activeCollection = matchingCollection;
  }
  if (params.product) {
    let prod = null;
    if (/^\d+$/.test(params.product)) prod = products.find(p => p.id == params.product);
    else prod = products.find(p => p.name.replace(/\s+/g,'').toLowerCase() === params.product.replace(/\s+/g,'').toLowerCase());
    if (prod) {
      activeCategory = prod.category;
      activeCollection = getProductCollection(prod);
    }
  }

  const productGrid = document.getElementById('product-grid');
  const categoryHero = document.getElementById('category-hero');

  renderGrid();

  if (params.product) {
    const initialProduct = /^\d+$/.test(params.product)
      ? products.find(product => product.id == params.product)
      : products.find(product => product.name.replace(/\s+/g, '').toLowerCase() === params.product.replace(/\s+/g, '').toLowerCase());
    if (initialProduct) openDetail(initialProduct.id);
  }

  productGrid.addEventListener('click', event => {
    const categoryCard = event.target.closest('[data-open-category]');
    if (categoryCard) {
      activeCategory = categoryCard.dataset.openCategory;
      activeCollection = "all";
      renderGrid();
      window.history.replaceState({}, '', buildCatalogueUrl());
      document.getElementById('category-hero').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    const collectionCard = event.target.closest('[data-open-collection]');
    if (!collectionCard) return;
    activeCollection = collectionCard.dataset.openCollection;
    renderGrid();
    window.history.replaceState({}, '', buildCatalogueUrl());
    document.getElementById('category-hero').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  categoryHero.addEventListener('click', event => {
    if (!event.target.closest('[data-show-categories]')) return;
    activeCategory = "all";
    activeCollection = "all";
    renderGrid();
    window.history.replaceState({}, '', buildCatalogueUrl());
  });
});
</script>
