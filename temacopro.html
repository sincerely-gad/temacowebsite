<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temaco Pro - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .floating-shapes {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .shape1 {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape2 {
            top: 60%;
            right: 10%;
            animation-delay: 2s;
            width: 150px;
            height: 150px;
        }

        .shape3 {
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
            width: 100px;
            height: 100px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: slideIn 1s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px rgba(255, 107, 53, 0.3));
            }
            to {
                filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.6));
            }
        }

        .coming-soon {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .description {
            color: #777;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }

        .back-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 53, 0.4);
            filter: brightness(1.1);
        }

        .back-link:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }
            .logo {
                font-size: 2.5rem;
            }
            .coming-soon {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="floating-shapes shape1"></div>
        <div class="floating-shapes shape2"></div>
        <div class="floating-shapes shape3"></div>
    </div>

    <div class="container">
        <h1 class="logo">Temaco Pro</h1>
        <h2 class="coming-soon">Coming Soon</h2>
        <p class="description">
            We're working hard to bring you something amazing. 
            Stay tuned for our exciting launch!
        </p>
        <a href="index.html" class="back-link" onclick="goToTemaco()">Back to Temaco</a>
    </div>

    <script>
        function goToTemaco() {
            // Add your Temaco URL here
            // window.location.href = 'https://temaco.com';
            alert('Redirecting to Temaco...');
        }
    </script>
</body>
</html>
